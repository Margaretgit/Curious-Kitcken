{% extends "base.html" %}
{% block title %}Curious Corner{% endblock %}
{% block content %}
<section class="page-head">
    <p class="eyebrow">FOOD SCIENCE</p>
    <h1>Curious Corner 🔬</h1>
    <p>Cooking is science you can taste! Click a question to reveal the answer.</p>
</section>
<section class="question-grid">
{% for item in questions %}
<article class="question-card">
    <button class="question-btn" onclick="toggleAnswer(this)">🤔 {{ item.question }} <span>+</span></button>
    <div class="answer">{{ item.answer }}</div>
</article>
{% endfor %}
</section>
{% endblock %}

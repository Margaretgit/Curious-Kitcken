<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Curious Kitchen{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">🍳 Curious Kitchen</a>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('recipes') }}">Recipes</a>
        <a href="{{ url_for('curious') }}">Curious Corner</a>
        <a href="{{ url_for('waste') }}">Save Food</a>
        <a href="{{ url_for('quiz') }}">Quiz</a>
    </nav>
</header>

<main>{% block content %}{% endblock %}</main>

<footer>
    <p>Curious Kitchen • Learn to cook, understand food, and reduce waste 🌱</p>
</footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
